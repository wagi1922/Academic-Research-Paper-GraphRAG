name: GraphRAG CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NEO4J_PASSWORD: "testpassword"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff black mypy

      - name: Run Ruff
        run: ruff check .

      - name: Run Black (check)
        run: black --check .

      - name: Run MyPy
        run: mypy app/

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      neo4j:
        image: neo4j:5.18-community
        env:
          NEO4J_AUTH: neo4j/${{ env.NEO4J_PASSWORD }}
          NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
          NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd="cypher-shell -u neo4j -p ${{ env.NEO4J_PASSWORD }} 'RETURN 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      - name: Wait for Neo4j
        run: |
          for i in {1..30}; do
            if cypher-shell -u neo4j -p ${{ env.NEO4J_PASSWORD }} "RETURN 1" 2>/dev/null; then
              echo "Neo4j ready"
              break
            fi
            sleep 2
          done

      - name: Run migrations
        run: python -m app.core.neo4j_migrate
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ${{ env.NEO4J_PASSWORD }}

      - name: Run tests
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=70
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ${{ env.NEO4J_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: openrouter/gpt-4o-mini
          EMBEDDING_MODEL: openrouter/nomic-embed-text

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: graphrag-backend:${{ github.sha }}
          load: true

      - name: Test image runs
        run: |
          docker run --rm -d --name test-backend \
            -e NEO4J_URI=bolt://host.docker.internal:7687 \
            -e NEO4J_USER=neo4j \
            -e NEO4J_PASSWORD=${{ env.NEO4J_PASSWORD }} \
            -e OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }} \
            -p 8000:8000 \
            graphrag-backend:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker stop test-backend

  experiment:
    name: Run Experiments (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyyaml mlflow

      - name: Start services
        run: |
          docker compose up -d neo4j
          sleep 30
          docker compose exec -T backend python -m app.core.neo4j_migrate

      - name: Run E1 Chunking
        run: python experiments/run_e1_chunking.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run E2 Embedding
        run: python experiments/run_e2_embedding.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run E3 Retrieval
        run: python experiments/run_e3_retrieval.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run E4 Ablation
        run: python experiments/run_e4_ablation.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: experiments/results/
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          git log --oneline --pretty=format:"- %s (%an)" $(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD")..HEAD > CHANGELOG.md || echo "- Initial release" > CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false