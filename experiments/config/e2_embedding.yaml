# Experiment E2: Embedding Model Comparison
# Compare embedding models for vector search quality
# OpenRouter FREE models only — NO PAID, NO LOCAL

experiment:
  name: "E2_Embedding_Model"
  description: "Compare embedding models for academic paper retrieval"
  version: "1.0"

embeddings:
  models:
    - name: "nomic-embed-text-v1.5"
      provider: "openrouter"
      model_id: "nomic-embed-text-v1.5:free"
      dimensions: 768
      description: "Nomic Embed Text v1.5 (OpenRouter free, 768d)"

    - name: "ling-3.2-flash"
      provider: "openrouter"
      model_id: "inclusionai/ling-3.2-flash:free"
      dimensions: 1024
      description: "Ling 3.2 Flash (OpenRouter free, dual-purpose LLM+embedding, 1024d)"

    - name: "gemma-4-31b"
      provider: "openrouter"
      model_id: "google/gemma-4-31b-it:free"
      dimensions: 2048
      description: "Gemma 4 31B IT (OpenRouter free, 2048d)"

    - name: "nemotron-3.5-lightning"
      provider: "openrouter"
      model_id: "nvidia/nemotron-3.5-lightning:free"
      dimensions: 1024
      description: "Nemotron 3.5 Lightning (OpenRouter free, 1024d)"

    - name: "particle-1"
      provider: "openrouter"
      model_id: "particle-ai/particle-1:free"
      dimensions: 1024
      description: "Particle 1 (OpenRouter free, 1024d)"

chunking:
  # Fixed chunking for fair comparison
  strategy: "fixed_512_50"
  params:
    chunk_size: 512
    chunk_overlap: 50

evaluation:
  metrics:
    - "retrieval_precision@5"
    - "retrieval_recall@10"
    - "retrieval_mrr@10"
    - "retrieval_ndcg@10"
    - "answer_f1"
    - "answer_faithfulness"
    - "citation_accuracy"
    - "latency_ms"
    - "embedding_dim"
    - "index_size_mb"

  test_queries: 30
  test_papers: 20

  gold_standard_path: "experiments/data/gold_queries.jsonl"

output:
  results_dir: "experiments/results/e2_embedding"
  save_embeddings: true
  save_index_stats: true