services:
  neo4j:
    image: neo4j:5.18-community
    container_name: graphrag-neo4j
    network_mode: host  # bridge network diblokir environment (veth operation not supported)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-graphrag123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2g
      - NEO4J_dbms_memory_pagecache_size=1g
      - NEO4J_server_config_strict__validation_enabled=false
      # host network: listen di semua interface langsung (7474 browser, 7687 bolt)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "graphrag123", "RETURN 1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: graphrag-backend
    network_mode: host
    environment:
      - NEO4J_URI=bolt://localhost:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-graphrag123}
      - NEO4J_DATABASE=neo4j
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL=nvidia/nemotron-3.5-lightning:free
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - EMBEDDING_URL=http://localhost:8788
      - GROBID_URL=http://localhost:8070/api/processFulltextDocument
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
      - /home/guard/Documents/perkuliahan/Skripsi/journal:/app/data/journal:ro
      - /home/guard/Documents/perkuliahan/sem 7/Cap/data/corpus/pdfs:/app/data/corpus/pdfs:ro
    depends_on:
      neo4j:
        condition: service_healthy
      grobid:
        condition: service_healthy
    env_file:
      - .env

  # Grobid for PDF parsing
  grobid:
    image: lfoppiano/grobid:0.8.2
    container_name: graphrag-grobid
    network_mode: host
    environment:
      - JAVA_OPTS=-XX:-UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dgrobid.consolidate.citations=false -Dgrobid.consolidate.header=false
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8070'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
