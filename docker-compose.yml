version: '3.8'

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"  # Browser
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-graphrag123}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2g
      - NEO4J_dbms_memory_pagecache_size=1g
      - NEO4J_server_config_strict__validation_enabled=false
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-graphrag123}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - graphrag-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: graphrag-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-graphrag123}
      - NEO4J_DATABASE=neo4j
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-openrouter/gpt-4o-mini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-openrouter/nomic-embed-text}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GROBID_URL=http://grobid:8070/api/processFulltextDocument
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
      - ~/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy
      grobid:
        condition: service_healthy
    networks:
      - graphrag-network
    env_file:
      - .env
    # profiles: ["dev"]  # Uncomment to run only with --profile dev

  # Grobid for PDF parsing
  grobid:
    image: lfoppiano/grobid:0.8.2
    container_name: graphrag-grobid
    ports:
      - "8070:8070"
    environment:
      - JAVA_OPTS=-XX:-UseContainerSupport -XX:MaxRAMPercentage=75.0
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - graphrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

networks:
  graphrag-network:
    driver: bridge